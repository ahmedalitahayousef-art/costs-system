<body>

<header class="topbar">
    <h1>📊 نظام إدارة التكاليف المشتركة</h1>
    <span class="tab-now" id="tab-now">لوحة التحكم</span>
    <div class="topbar-actions no-print">
        <span class="last-save" id="last-save">آخر حفظ: —</span>
        <button class="btn btn-light btn-sm" onclick="saveNow()">💾 حفظ</button>
        <button id="btn-recover-v1" class="btn btn-warning btn-sm" style="display:none" onclick="restoreV1Manual()">🔄 استعادة النسخة السابقة</button>
        <button class="btn btn-light btn-sm" onclick="exportBackup()">📦 نسخة احتياطية</button>
        <button class="btn btn-light btn-sm" onclick="document.getElementById('backup-file').click()">📂 استعادة</button>
        <input type="file" id="backup-file" accept=".json" style="display:none" onchange="importBackup(event)">

</header>

<nav>
    <button class="active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 لوحة التحكم</button>
    <button data-tab="projects" onclick="switchTab('projects')">📁 المشاريع</button>
    <button data-tab="positions" onclick="switchTab('positions')">👤 الوظائف المشتركة</button>
    <button data-tab="opening" onclick="switchTab('opening')">🗄️ الأرصدة الافتتاحية</button>
    <button data-tab="rates" onclick="switchTab('rates')">⚖️ النسب المعتمدة</button>
    <button data-tab="allocation" onclick="switchTab('allocation')">📋 التوزيع الشهري</button>
    <button data-tab="costs" onclick="switchTab('costs')">🏢 المصروفات الأخرى</button>
    <button data-tab="reports" onclick="switchTab('reports')">📈 التقارير الشهرية</button>
</nav>

<div class="container">
    <section id="dashboard" class="tab-content active"></section>
    <section id="projects" class="tab-content"></section>
    <section id="positions" class="tab-content"></section>
    <section id="opening" class="tab-content"></section>
    <section id="rates" class="tab-content"></section>
    <section id="allocation" class="tab-content"></section>

<div id="toast"></div>

<script>
// ================================================================
// 1. البيانات والنسخ الاحتياطي
// ================================================================
const STORAGE_KEY = 'costsSystem_v2';
const LASTSAVE_KEY = 'costsSystem_v2_lastsave';

let state = {
    initialized:false, v1Migrated:false,
    projects:[], positions:[], allocations:{}, approvedRates:{},
    coverageSalaries:{}, coverageRent:{}, coverageOther:{},
    openingBalances:{version:2,date:'',salaries:{},rent:{},other:{},notes:{},legacySalaries:{}},
    otherCosts:[],
    currentMonth:new Date().toISOString().slice(0,7),
    nextProjId:1,nextPosId:1,nextCostId:1
};
let editingProjId=null, editingPosId=null, activeTab='dashboard', toastTimer=null;
let activeReport=null, reportMonth=null, reportProject=null, reportPosition=null;

function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function loadState(){
    const s=localStorage.getItem(STORAGE_KEY);
    if(s){try{state=Object.assign(state,JSON.parse(s));}catch(e){console.error(e);}}
    if(!state.approvedRates)state.approvedRates={};
    if(!state.coverageSalaries)state.coverageSalaries={};
    if(!state.coverageRent)state.coverageRent={};
    if(!state.coverageOther)state.coverageOther={};
    migrateOpeningBalances();
    if(state.coverageCount){
        Object.keys(state.coverageCount).forEach(pid=>{
            const n=parseInt(state.coverageCount[pid])||0;
            if(state.coverageRent[pid]===undefined)state.coverageRent[pid]=n;
            if(state.coverageOther[pid]===undefined)state.coverageOther[pid]=n;
            if(!state.coverageSalaries[pid])state.coverageSalaries[pid]={};
            state.positions.forEach(pos=>{
                if(state.coverageSalaries[pid][pos.id]===undefined)state.coverageSalaries[pid][pos.id]=n;
            });
        });
        delete state.coverageCount; saveState();
    }
    if(state.coverageMonths){
        Object.keys(state.coverageMonths).forEach(k=>{
            const v=state.coverageMonths[k];
            const n=Array.isArray(v)?v.length:(parseInt(v)||0);
            if(n>0&&state.coverageRent[k]===undefined){state.coverageRent[k]=n;state.coverageOther[k]=n;
                if(!state.coverageSalaries[k])state.coverageSalaries[k]={};
                state.positions.forEach(pos=>{if(state.coverageSalaries[k][pos.id]===undefined)state.coverageSalaries[k][pos.id]=n;});
            }
        });
        delete state.coverageMonths; saveState();
    }
    if(state.rateValidity)delete state.rateValidity;
    // ⭐ ترحيل بنود المصاريف القديمة: إضافة expected وdistributionActual
    (state.otherCosts||[]).forEach(c=>{
        if(c.expected===undefined)c.expected=c.monthly||0;
        if(!c.distributionActual)c.distributionActual={};
    });
    if(!reportMonth)reportMonth=state.currentMonth;
}
function migrateOpeningBalances(){
    const ob=state.openingBalances;
    if(ob&&ob.version===2)return;
    const n={version:2,date:'',salaries:{},rent:{},other:{},notes:{},legacySalaries:{}};
    if(ob&&typeof ob==='object'){
        Object.keys(ob).forEach(k=>{
            if(k==='version')return;
            const o=ob[k];
            if(!o||typeof o!=='object')return;
            if(o.date&&!n.date)n.date=o.date;
            n.rent[k]=parseFloat(o.rent)||0;
            n.other[k]=parseFloat(o.other)||0;
            n.notes[k]=o.notes||'';
            const sal=parseFloat(o.salaries)||0;
            if(sal>0)n.legacySalaries[k]=(n.legacySalaries[k]||0)+sal;
        });
    }
    state.openingBalances=n; saveState();
}
function migrateFromV1(oldData){
    localStorage.setItem('costsSystem_v2_pre_restore',JSON.stringify(state));
    state.projects=(oldData.projects||[]).map(p=>({
        id:p.id,code:p.code||'',nameAr:p.nameAr||p.name||'',nameEn:p.nameEn||'',
        donor:p.donor||'',startDate:p.startDate||'',endDate:p.endDate||'',
        budgetSalaries:p.budgetSalaries!==undefined?p.budgetSalaries:(parseFloat(p.budget)||0),
        budgetRent:parseFloat(p.budgetRent)||0,budgetOther:parseFloat(p.budgetOther)||0,
        pinnedEnd:!!p.pinnedEnd,status:p.status||'نشط'
    }));
    state.positions=oldData.positions||[];
    state.allocations=oldData.allocations||{};
    state.otherCosts=(oldData.otherCosts||[]).map(c=>({
        id:c.id,name:c.name||'',type:c.type||'تشغيلية',
        monthly:parseFloat(c.monthly)||0,
        expected:c.expected!==undefined?parseFloat(c.expected):(parseFloat(c.monthly)||0),
        spent:parseFloat(c.spent)||0,
        distribution:c.distribution||{},
        distributionActual:c.distributionActual||{},
        approved:parseFloat(c.approved)||0
    }));
    state.currentMonth=oldData.currentMonth||state.currentMonth;
    state.nextProjId=Math.max(oldData.nextProjId||1,...state.projects.map(p=>p.id+1),1);
    state.nextPosId=Math.max(oldData.nextPosId||1,...state.positions.map(p=>p.id+1),1);
    state.nextCostId=Math.max(oldData.nextCostId||1,...state.otherCosts.map(c=>c.id+1),1);
    state.initialized=true; state.v1Migrated=true;
    const m=state.currentMonth, allocs=state.allocations[m]||{};
    const rates={salaries:{},rent:{},other:{}};
    state.positions.forEach(pos=>{rates.salaries[pos.id]={};state.projects.forEach(p=>{rates.salaries[pos.id][p.id]=(allocs[pos.id]&&allocs[pos.id][p.id])||0;});});
    const rT=state.otherCosts.filter(c=>c.type==='إيجار').reduce((s,c)=>s+(c.expected||c.monthly||0),0);
    const oT=state.otherCosts.filter(c=>c.type!=='إيجار').reduce((s,c)=>s+(c.expected||c.monthly||0),0);
    state.projects.forEach(p=>{
        const rl=state.otherCosts.filter(c=>c.type==='إيجار').reduce((s,c)=>s+((c.distribution&&c.distribution[p.id])||0),0);
        rates.rent[p.id]=rT?+(rl/rT*100).toFixed(2):0;
        const ol=state.otherCosts.filter(c=>c.type!=='إيجار').reduce((s,c)=>s+((c.distribution&&c.distribution[p.id])||0),0);
        rates.other[p.id]=oT?+(ol/oT*100).toFixed(2):0;
    });
    state.approvedRates[m]=rates;
    if(!state.coverageSalaries)state.coverageSalaries={};
    if(!state.coverageRent)state.coverageRent={};
    if(!state.coverageOther)state.coverageOther={};
    if(!state.openingBalances||state.openingBalances.version!==2)
        state.openingBalances={version:2,date:'',salaries:{},rent:{},other:{},notes:{},legacySalaries:{}};
    saveState();
}
function checkV1Data(){
    const v1Raw=localStorage.getItem('costsSystem');
    if(v1Raw){
        document.getElementById('btn-recover-v1').style.display='inline-flex';
        if(!state.v1Migrated){
            try{
                const oldData=JSON.parse(v1Raw);
                if(oldData&&oldData.projects&&oldData.projects.length>0){
                    if(confirm('تم العثور على بياناتك من النسخة السابقة!\nهل تريد استعادتها الآن؟')){
                        migrateFromV1(oldData); alert('✅ تمت الاستعادة بنجاح!');
                    }else{state.v1Migrated=true;saveState();}
                }
            }catch(e){console.error(e);}
        }
    }
}
function restoreV1Manual(){
    const v1Raw=localStorage.getItem('costsSystem');
    if(!v1Raw){alert('لا توجد بيانات محفوظة من النسخة السابقة.');return;}
    if(confirm('سيتم استعادة البيانات من النسخة الأولى. متابعة؟')){
        migrateFromV1(JSON.parse(v1Raw)); renderTab(activeTab); alert('✅ تمت الاستعادة بنجاح!');
    }
}
function exportBackup(){
    saveState();
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`نسخة_احتياطية_التكاليف_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
}
function importBackup(event){
    const file=event.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=function(e){
        try{
            const imported=JSON.parse(e.target.result);
            if(!imported.projects||!imported.positions){alert('⚠️ الملف غير صالح!');return;}
            if(confirm('استعادة هذه النسخة واستبدال البيانات الحالية؟')){
                state=Object.assign(state,imported);
                if(!state.approvedRates)state.approvedRates={};
                if(!state.coverageSalaries)state.coverageSalaries={};
                if(!state.coverageRent)state.coverageRent={};
                if(!state.coverageOther)state.coverageOther={};
                (state.otherCosts||[]).forEach(c=>{
                    if(c.expected===undefined)c.expected=c.monthly||0;
                    if(!c.distributionActual)c.distributionActual={};
                });
                state.initialized=true; migrateOpeningBalances(); saveState();
                updateLastSaveLabel(); renderTab(activeTab); alert('✅ تمت الاستعادة بنجاح!');
            }
        }catch(err){alert('⚠️ خطأ في قراءة الملف.');}
        event.target.value='';
    };
    reader.readAsText(file);
}
function saveNow(){
    saveState();
    const t=new Date();
    const hh=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    localStorage.setItem(LASTSAVE_KEY,hh); updateLastSaveLabel();
    showToast('✅ تم الحفظ بنجاح — '+hh);
}
function updateLastSaveLabel(){
    const v=localStorage.getItem(LASTSAVE_KEY);
    const el=document.getElementById('last-save');
    if(el)el.textContent='آخر حفظ: '+(v||'—');
}
function showToast(msg){
    const el=document.getElementById('toast');
    el.textContent=msg; el.style.display='block'; el.style.opacity='1';
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>{el.style.opacity='0';setTimeout(()=>{el.style.display='none';},300);},2500);
}
function addSampleData(){
    if(state.initialized)return;
    state.projects=[
        {id:1,code:'P001',nameAr:'مشروع المجموعات الثلاث',nameEn:'Tri-Cluster UNHCR',donor:'UNHCR',startDate:'2025-01-01',endDate:'2025-06-30',budgetSalaries:30000,budgetRent:12000,budgetOther:8000,status:'نشط'},

function fmt(n){return '$'+parseFloat(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function fmtPct(n){return parseFloat(n||0).toFixed(2)+'%';}
function monthName(m){
    const names=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const parts=m.split('-');
    return names[parseInt(parts[1])-1]+' '+parts[0];
}
function monthsBetween(d1,d2){
    if(!d1||!d2)return 0;
    const a=d1.slice(0,7).split('-'),b=d2.slice(0,7).split('-');
    const y1=+a[0],m1=+a[1],y2=+b[0],m2=+b[1];
    if(isNaN(y1)||isNaN(m1)||isNaN(y2)||isNaN(m2))return 0;
    return Math.max(0,(y2-y1)*12+(m2-m1)+1);
}
function getOrderedProjects(){
    return state.projects.filter(p=>!p.pinnedEnd).concat(state.projects.filter(p=>p.pinnedEnd));
}
function moveProject(id,dir){
    const idx=state.projects.findIndex(p=>p.id===id);
    if(idx===-1)return;
    const ni=idx+dir;
    if(ni<0||ni>=state.projects.length)return;
    const cur=state.projects[idx],nb=state.projects[ni];
    if(!!cur.pinnedEnd!==!!nb.pinnedEnd){
        alert('المشاريع المثبتة (📌) تبقى دائماً في نهاية القائمة.\nأزل التثبيت أولاً إن أردت تغيير موقعه.');
        return;
    }
    state.projects[idx]=nb; state.projects[ni]=cur;
    saveState(); renderProjects();
}
function togglePin(id){
    const p=state.projects.find(x=>x.id===id); if(!p)return;
    p.pinnedEnd=!p.pinnedEnd;
    saveState(); renderProjects();
    showToast(p.pinnedEnd?'📌 تم تثبيت '+p.code+' في نهاية القائمة':'تم إلغاء تثبيت '+p.code);
}
function getCovSal(projId,posId){
    const v=(state.coverageSalaries[projId]&&state.coverageSalaries[projId][posId]);
    return (v===undefined||v===null)?0:(parseInt(v)||0);
}
function setCovSal(projId,posId,val){
    if(!state.coverageSalaries[projId])state.coverageSalaries[projId]={};
    state.coverageSalaries[projId][posId]=parseInt(val)||0;
    saveState();
}
function getCovRent(projId){return parseInt(state.coverageRent[projId])||0;}
function setCovRent(projId,val){state.coverageRent[projId]=parseInt(val)||0;saveState();}
function getCovOther(projId){return parseInt(state.coverageOther[projId])||0;}
function setCovOther(projId,val){state.coverageOther[projId]=parseInt(val)||0;saveState();}
function covSalAmountPos(projId,posId,rates){
    const pos=state.positions.find(x=>x.id===posId);
    if(!pos)return 0;
    const appr=(rates.salaries[posId]&&rates.salaries[posId][projId])||0;
    return pos.salary*appr/100*getCovSal(projId,posId);
}
function covSalAmountProj(projId,rates){
    return state.positions.reduce((s,pos)=>s+covSalAmountPos(projId,pos.id,rates),0);
}
function expectedCostTotal(type){
    return state.otherCosts.filter(c=>c.type===type).reduce((s,c)=>s+(c.expected||0),0);
}
function covRentAmount(projId,rates){
    return expectedCostTotal('إيجار')*((rates.rent[projId]||0)/100)*getCovRent(projId);
}
function covOtherAmount(projId,rates){
    return expectedCostTotal('تشغيلية')*((rates.other[projId]||0)/100)*getCovOther(projId);
}
function costTypeLabel(t){return t==='إيجار'?'إيجار':'أخرى ومختلفة';}
function statusBadge(remaining,budget){
    if(!budget)return '<span class="badge badge-yellow">لا ميزانية</span>';
    if(remaining<0)return '<span class="badge badge-red">🔴 تجاوز</span>';
    const used=1-(remaining/budget);
    if(used>0.9)return '<span class="badge badge-red">🔴 حرج</span>';
    if(used>0.75)return '<span class="badge badge-yellow">🟡 تحذير</span>';
    return '<span class="badge badge-green">🟢 آمن</span>';
}
function covBadge(expected,actual){
    if(expected<=0&&actual<=0)return '<span class="badge badge-yellow">لم تُحدد</span>';
    const diff=actual-expected;
    if(diff>0.01)return `<span class="badge badge-red">🔴 تجاوز ${fmt(diff)}</span>`;
    if(Math.abs(diff)<=0.01)return '<span class="badge badge-yellow">🟡 اكتملت</span>';
    return `<span class="badge badge-green">🟢 متبقٍ ${fmt(-diff)}</span>`;
}
function rateStatus(total){
    if(Math.abs(total-100)<0.01)return '<span class="badge badge-green">✅ 100%</span>';
    if(total<100)return `<span class="badge badge-yellow">⚠️ فجوة ${fmtPct(100-total)}</span>`;
    return `<span class="badge badge-red">🔴 تجاوز ${fmtPct(total-100)}</span>`;
}
function monthsConsumed(project){
    const ps=(project.startDate||'').slice(0,7),pe=(project.endDate||'').slice(0,7);
    return Object.keys(state.allocations).filter(m=>{
        if(ps&&m<ps)return false;
        if(pe&&m>pe)return false;
        const a=state.allocations[m];
        return state.positions.some(pos=>a[pos.id]&&(a[pos.id][project.id]||0)>0);
    }).length;
}
function getOB(){
    if(!state.openingBalances||state.openingBalances.version!==2)migrateOpeningBalances();
    const ob=state.openingBalances;
    ob.salaries=ob.salaries||{};ob.rent=ob.rent||{};ob.other=ob.other||{};ob.notes=ob.notes||{};ob.legacySalaries=ob.legacySalaries||{};
    return ob;
}
function getOpeningPosProject(posId,projectId){
    const ob=getOB();
    return (ob.salaries[posId]&&ob.salaries[posId][projectId])||0;
}
function getOpeningSal(projectId){return state.positions.reduce((s,pos)=>s+getOpeningPosProject(pos.id,projectId),0);}
function getOpeningRent(projectId){return parseFloat(getOB().rent[projectId])||0;}
function getOpeningOther(projectId){return parseFloat(getOB().other[projectId])||0;}
function getOpeningTotals(){
    const t={salaries:0,rent:0,other:0,all:0};
    state.projects.forEach(p=>{t.salaries+=getOpeningSal(p.id);t.rent+=getOpeningRent(p.id);t.other+=getOpeningOther(p.id);});
    t.all=t.salaries+t.rent+t.other;
    return t;
}
function getRates(month){
    if(!state.approvedRates)state.approvedRates={};
    if(!state.approvedRates[month]){
        const prev=Object.keys(state.approvedRates).sort().filter(x=>x<month).pop();
        if(prev){state.approvedRates[month]=JSON.parse(JSON.stringify(state.approvedRates[prev]));}
        else{
            const r={salaries:{},rent:{},other:{}};
            state.positions.forEach(pos=>{r.salaries[pos.id]={};state.projects.forEach(p=>r.salaries[pos.id][p.id]=0);});
            state.approvedRates[month]=r;
        }
        saveState();
    }
    const r=state.approvedRates[month];
    r.salaries=r.salaries||{};r.rent=r.rent||{};r.other=r.other||{};
    state.positions.forEach(pos=>{
        if(!r.salaries[pos.id])r.salaries[pos.id]={};
        state.projects.forEach(p=>{if(r.salaries[pos.id][p.id]===undefined)r.salaries[pos.id][p.id]=0;});
    });
    state.projects.forEach(p=>{
        if(r.rent[p.id]===undefined)r.rent[p.id]=0;
        if(r.other[p.id]===undefined)r.other[p.id]=0;
    });
    return r;
}
function cumulativeSalLoaded(){
    const res={};
    const projs=getOrderedProjects();
    projs.forEach(p=>res[p.id]=0);
    Object.keys(state.allocations).sort().forEach(m=>{
        const d=getDistribution(m);
        projs.forEach((p,i)=>{res[p.id]+=d.reduce((s,x)=>s+x.projects[i].amount,0);});
    });
    return res;
}

function getDistribution(month){
    const projects=getOrderedProjects(),positions=state.positions;
    const pct=state.allocations[month]||{};
    return positions.map(pos=>{
        let remaining=pos.salary;
        const projData=projects.map(proj=>{
            const p=(pct[pos.id]&&pct[pos.id][proj.id])||0;
            const amount=pos.salary*p/100;
            const before=remaining,after=before-amount;
            remaining=after;
            return {project:proj,before,percentage:p,amount,after};
        });
        const totalLoaded=projData.reduce((s,d)=>s+d.amount,0);
        return {position:pos,projects:projData,totalLoaded,remaining:pos.salary-totalLoaded};
    });
}

function getCostLoadedExpected(projectId,type){
    return state.otherCosts.filter(c=>c.type===type)
        .reduce((s,c)=>s+((c.distribution&&c.distribution[projectId])||0),0);
}

function saveProject(){
    const code=document.getElementById('pj-code').value.trim();
    const nameAr=document.getElementById('pj-nameAr').value.trim();
    const nameEn=document.getElementById('pj-nameEn').value.trim();
    if(!code||(!nameAr&&!nameEn)){alert('يرجى إدخال الكود واسم المشروع');return;}
    const pinEl=document.getElementById('pj-pin');
    const data={
        code,nameAr:nameAr||nameEn,nameEn,
        donor:document.getElementById('pj-donor').value.trim(),
        startDate:document.getElementById('pj-start').value,
        endDate:document.getElementById('pj-end').value,
        budgetSalaries:parseFloat(document.getElementById('pj-budgetSalaries').value)||0,
        budgetRent:parseFloat(document.getElementById('pj-budgetRent').value)||0,
        budgetOther:parseFloat(document.getElementById('pj-budgetOther').value)||0,
        pinnedEnd:pinEl?pinEl.checked:false,
        status:document.getElementById('pj-status').value
    };
    if(editingProjId!==null){
        const idx=state.projects.findIndex(p=>p.id===editingProjId);
        if(idx!==-1)state.projects[idx]=Object.assign(state.projects[idx],data);
        editingProjId=null;
    }else{
        state.projects.push(Object.assign({id:state.nextProjId++},data));
    }
    saveState(); renderProjects(); showToast('💾 تم حفظ بيانات المشروع');
}
function editProject(id){editingProjId=id;renderProjects();document.getElementById('proj-form-card').scrollIntoView({behavior:'smooth'});}
function cancelEditProject(){editingProjId=null;renderProjects();}
function delProject(id){
    if(confirm('هل أنت متأكد من حذف هذا المشروع؟')){
        state.projects=state.projects.filter(p=>p.id!==id);
        if(state.coverageSalaries)delete state.coverageSalaries[id];
        if(state.coverageRent)delete state.coverageRent[id];
        if(state.coverageOther)delete state.coverageOther[id];
        const ob=state.openingBalances;
        if(ob){
            if(ob.rent)delete ob.rent[id];
            if(ob.other)delete ob.other[id];
            if(ob.notes)delete ob.notes[id];
            if(ob.legacySalaries)delete ob.legacySalaries[id];
            if(ob.salaries)Object.keys(ob.salaries).forEach(pk=>{if(ob.salaries[pk])delete ob.salaries[pk][id];});
        }
        if(editingProjId===id)editingProjId=null;
        saveState(); renderProjects();
    }
}

function savePosition(){
    const code=document.getElementById('ps-code').value.trim();
    const name=document.getElementById('ps-name').value.trim();
    const salary=parseFloat(document.getElementById('ps-salary').value)||0;
    const grade=document.getElementById('ps-grade').value.trim();
    if(!code||!name||salary<=0){alert('يرجى إدخال جميع البيانات');return;}
    if(editingPosId!==null){
        const idx=state.positions.findIndex(p=>p.id===editingPosId);
        if(idx!==-1)state.positions[idx]=Object.assign(state.positions[idx],{code,name,grade,salary});
        editingPosId=null;
    }else{
        state.positions.push({id:state.nextPosId++,code,name,grade,salary});
    }
    saveState(); renderPositions(); showToast('💾 تم حفظ بيانات الوظيفة');
}
function editPosition(id){editingPosId=id;renderPositions();document.getElementById('pos-form-card').scrollIntoView({behavior:'smooth'});}
function cancelEditPosition(){editingPosId=null;renderPositions();}
function delPosition(id){
    if(confirm('هل أنت متأكد؟')){
        state.positions=state.positions.filter(p=>p.id!==id);
        const ob=getOB();
        if(ob.salaries[id])delete ob.salaries[id];
        Object.keys(state.coverageSalaries).forEach(pid=>{if(state.coverageSalaries[pid][id]!==undefined)delete state.coverageSalaries[pid][id];});
        if(editingPosId===id)editingPosId=null;
        saveState(); renderPositions();
    }
}

function updateRate(type,posId,projId,val){
    const m=state.currentMonth;
    const r=getRates(m);
    const v=parseFloat(val)||0;
    if(type==='salaries'){
        if(!r.salaries[posId])r.salaries[posId]={};
        r.salaries[posId][projId]=v;
    }else{
        r[type][projId]=v;
    }
    saveState(); renderRates();
}
function copyRatesPrev(){
    const m=state.currentMonth;
    const prev=Object.keys(state.approvedRates).sort().filter(x=>x<m).pop();
    if(!prev){alert('لا يوجد شهر سابق محفوظ');return;}
    state.approvedRates[m]=JSON.parse(JSON.stringify(state.approvedRates[prev]));
    saveState(); renderRates();
    alert('✅ تم النسخ من شهر '+monthName(prev));
}

        d.projects.forEach((pd,i)=>{
            const appr=(rates.salaries[d.position.id]&&rates.salaries[d.position.id][projects[i].id])||0;
            const diff=Math.abs(pd.percentage-appr)>0.01;
            rows+=`<td class="remaining">${fmt(pd.before)}</td>
            <td><input type="number" class="pct-input" value="${pd.percentage}" min="0" max="100" step="0.01" style="${diff?'border-color:#dc3545;background:#fdf2f3':''}" onchange="updatePct(${d.position.id},${projects[i].id},this.value)">
            <div class="cell-hint" style="color:${diff?'#dc3545':'#999'}">معتمدة: ${fmtPct(appr)}</div></td>
            <td class="amount">${fmt(pd.amount)}</td>
            <td class="remaining">${fmt(pd.after)}</td>`;
        });
        rows+=`<td><strong>${fmt(d.totalLoaded)}</strong></td>
        <td><strong style="color:${Math.abs(d.remaining)>0.01?'#dc3545':'#28a745'}">${fmt(d.remaining)}</strong></td></tr>`;
    });
    let totalRow=`<tr class="total-row"><td colspan="3">📊 المجموع</td>`;
    for(let i=0;i<projects.length;i++){
        const amt=dist.reduce((s,d)=>s+d.projects[i].amount,0);
        const pct=dist.reduce((s,d)=>s+d.projects[i].percentage,0);
        totalRow+=`<td></td><td>${fmtPct(pct)}</td><td>${fmt(amt)}</td><td></td>`;
    }
    totalRow+=`<td>${fmt(totalLoaded)}</td><td style="color:${Math.abs(gap)>0.01?'#dc3545':'#28a745'}">${fmt(gap)}</td></tr>`;
    let cmpRows=projects.map((p,i)=>{
        const expPct=positions.reduce((s,pos)=>s+((rates.salaries[pos.id]&&rates.salaries[pos.id][p.id])||0),0);
        const actPct=dist.reduce((s,d)=>s+d.projects[i].percentage,0);
        const expAmt=positions.reduce((s,pos)=>{const a=(rates.salaries[pos.id]&&rates.salaries[pos.id][p.id])||0;return s+pos.salary*a/100;},0);
        const actAmt=dist.reduce((s,d)=>s+d.projects[i].amount,0);
        const d$=actAmt-expAmt;
        return `<tr><td title="${p.nameAr}"><strong>${p.code}</strong></td>
        <td>${fmtPct(expPct)}</td><td>${fmtPct(actPct)}</td>
        <td style="color:${Math.abs(actPct-expPct)>0.01?'#dc3545':'#28a745'}">${fmtPct(actPct-expPct)}</td>
        <td>${fmt(expAmt)}</td><td>${fmt(actAmt)}</td>
        <td style="color:${d$>0.01?'#dc3545':(d$<-0.01?'#B8860B':'#28a745')}"><strong>${fmt(d$)}</strong></td>
        <td>${Math.abs(d$)<0.01?'<span class="badge badge-green">✅ مطابق</span>':(d$>0?'<span class="badge badge-red">أعلى</span>':'<span class="badge badge-yellow">أقل</span>')}</td></tr>`;
    }).join('');

        const o=getOpeningSal(p.id);
        const loadedMonth=dist.reduce((s,d)=>s+d.projects[i].amount,0);
        const available=(p.budgetSalaries||0)-o;
        const remaining=available-loadedMonth;
        return `<tr><td title="${p.nameAr}"><strong>${p.code}</strong></td>
        <td>${fmt(p.budgetSalaries||0)}</td><td>${fmt(o)}</td>
        <td>${fmt(available)}</td><td>${fmt(loadedMonth)}</td>
        <td style="color:${remaining<0?'#dc3545':'#28a745'}"><strong>${fmt(remaining)}</strong></td>
        <td>${statusBadge(remaining,p.budgetSalaries)}</td></tr>`;

    <div class="card">
        <div class="actions-row">
            <div style="min-width:180px"><label style="font-size:12px;color:#6b7280;font-weight:600">الشهر</label><input type="month" value="${month}" onchange="changeMonth(this.value)"></div>
            <button class="btn btn-success" onclick="applyApprovedToAllocation()">⚡ تطبيق النسب المعتمدة</button>
            <button class="btn btn-warning" onclick="copyPcts()">📋 نسخ من الشهر السابق</button>
            <button class="btn btn-primary" onclick="showProposals()">💡 مقترحات التسريع</button>
        </div>
    </div>
    ${gap>0.01?`<div class="gap-alert"><h3>⚠️ الفجوة الشهرية: ${fmt(gap)}</h3>
        <p>هذا المبلغ غير مغطى من المشاريع. استخدم مقترحات التسريع لملء الفجوة أو عدّل النسب يدوياً.</p></div>`:''}
    <div class="card" id="proposals-section" style="display:none"></div>
    <div class="card" style="overflow-x:auto">
        <div class="card-title">📋 مصفوفة التوزيع <span style="font-size:11px;color:#888">(مرّر الماوس على الرمز للاسم الكامل • النسب الحمراء تخالف المعتمدة)</span></div>
        <table class="alloc-table"><thead><tr>${h1}</tr><tr>${h2}</tr></thead>
        <tbody>${rows}${totalRow}</tbody></table>
        ${legend}
    </div>
    <div class="card" style="overflow-x:auto">
        <div class="card-title">⚖️ مقارنة المطبق بالنسب المعتمدة</div>
        <table><thead><tr><th>المشروع</th><th>نسبة معتمدة</th><th>نسبة مطبقة</th><th>الفرق %</th><th>المتوقع $</th><th>المحمّل $</th><th>الفرق $</th><th>الحالة</th></tr></thead>
        <tbody>${cmpRows}</tbody></table>
    </div>
    <div class="card" style="overflow-x:auto">
        <div class="card-title">💵 وضع ميزانية المرتبات (بعد خصم الافتتاحي)</div>
        <table><thead><tr><th>المشروع</th><th>ميزانية المرتبات</th><th>الافتتاحي المصروف</th><th>المتاح</th><th>محمّل هذا الشهر</th><th>المتبقي</th><th>الحالة</th></tr></thead>
        <tbody>${budgetRows}</tbody></table>
    </div>
    <div class="card">
        <div class="card-title">📌 المتبقي النهائي</div>
        <p style="font-size:18px">المتبقي غير الموزع: <strong style="color:${Math.abs(gap)>0.01?'#dc3545':'#28a745'};font-size:24px">${fmt(gap)}</strong>
        ${Math.abs(gap)<=0.01?' ✅ جميع الرواتب موزعة بالكامل':' ⚠️ يوجد فرق يحتاج توزيع'}</p>
    </div>
    <div class="card no-print"><button class="btn btn-success" onclick="saveNow()">💾 حفظ كل المدخلات</button></div>`;
}
function applyApprovedToAllocation(){
    const m=state.currentMonth;
    const rates=getRates(m);
    if(!confirm('سيتم استبدال نسب التوزيع الشهري بالنسب المعتمدة. متابعة؟'))return;
    state.allocations[m]={};
    state.positions.forEach(pos=>{
        state.allocations[m][pos.id]={};
        getOrderedProjects().forEach(p=>{
            state.allocations[m][pos.id][p.id]=(rates.salaries[pos.id]&&rates.salaries[pos.id][p.id])||0;
        });
    });
    saveState(); renderAllocation(); alert('✅ تم تطبيق النسب المعتمدة');
}
function updatePct(posId,projId,val){
    const m=state.currentMonth;
    if(!state.allocations[m])state.allocations[m]={};
    if(!state.allocations[m][posId])state.allocations[m][posId]={};
    state.allocations[m][posId][projId]=parseFloat(val)||0;
    saveState(); renderAllocation();
}
function changeMonth(m){
    state.currentMonth=m;
    if(!state.allocations[m]){
        const prev=Object.keys(state.allocations).sort().filter(x=>x<m).pop();
        if(prev)state.allocations[m]=JSON.parse(JSON.stringify(state.allocations[prev]));
        else state.allocations[m]={};
    }
    getRates(m);
    saveState(); renderTab(activeTab);
}
function copyPcts(){
    const m=state.currentMonth;
    const prev=Object.keys(state.allocations).sort().filter(x=>x<m).pop();
    if(!prev){alert('لا يوجد شهر سابق محفوظ');return;}
    state.allocations[m]=JSON.parse(JSON.stringify(state.allocations[prev]));
    saveState(); renderAllocation(); alert('✅ تم النسخ من الشهر السابق');
}

    const totalLoaded=dist.reduce((s,d)=>s+d.totalLoaded,0);
    const gap=totalSal-totalLoaded;
    if(gap<=0.01){alert('لا توجد فجوة - التوزيع مكتمل 100%');return;}
    const projects=getOrderedProjects();
    const proposals=[];
    proposals.push({name:'تسريع نسبي (كل وظيفة تزيد بنفس مساهمتها)',data:dist.map(d=>{
        const pcts=projects.map((_,i)=>d.projects[i].percentage);
        const total=pcts.reduce((s,p)=>s+p,0);
        if(total===0)return {pos:d.position,pcts:projects.map(()=>+(100/projects.length).toFixed(2)),total:100};
        const mult=100/total;
        const newPcts=pcts.map(p=>+(p*mult).toFixed(2));
        return {pos:d.position,pcts:newPcts,total:newPcts.reduce((s,p)=>s+p,0)};
    })});
    proposals.push({name:'تسريع حسب الأولوية (المشروع الأول يأخذ الفجوة)',data:dist.map(d=>{
        const pcts=projects.map((_,i)=>d.projects[i].percentage);
        const total=pcts.reduce((s,p)=>s+p,0);
        if(total===0)return {pos:d.position,pcts:projects.map((_,i)=>i===0?100:0),total:100};
        const newPcts=[...pcts];
        newPcts[0]=+(newPcts[0]+(100-total)).toFixed(2);
        return {pos:d.position,pcts:newPcts,total:newPcts.reduce((s,p)=>s+p,0)};
    })});
    proposals.push({name:'توزيع متساوٍ (الفجوة مقسومة بالتساوي)',data:dist.map(d=>{
        const pcts=projects.map((_,i)=>d.projects[i].percentage);
        const total=pcts.reduce((s,p)=>s+p,0);
        if(total===0)return {pos:d.position,pcts:projects.map(()=>+(100/projects.length).toFixed(2)),total:100};
        const add=(100-total)/projects.length;
        const newPcts=pcts.map(p=>+(p+add).toFixed(2));
        return {pos:d.position,pcts:newPcts,total:newPcts.reduce((s,p)=>s+p,0)};
    })});
    window._proposals=proposals;
    let html=`<div class="card-title">💡 مقترحات التسريع — الفجوة: ${fmt(gap)}</div>
    <p style="margin-bottom:12px">راجع المقترحات واختر الأنسب، أو عدّل النسب يدوياً في الجدول:</p>`;
    proposals.forEach((prop,idx)=>{
        html+=`<div class="proposal-box"><h3>💡 المقترح ${idx+1}: ${prop.name}</h3>
        <table><thead><tr><th>الوظيفة</th>${projects.map(p=>`<th title="${p.nameAr}">${p.code}</th>`).join('')}<th>المجموع</th></tr></thead>
        <tbody>${prop.data.map(d=>`<tr><td>${d.pos.name}</td>${d.pcts.map(p=>`<td>${fmtPct(p)}</td>`).join('')}<td><strong>${fmtPct(d.total)}</strong></td></tr>`).join('')}
        </tbody></table>
        <button class="btn btn-success" style="margin-top:10px" onclick="applyProposal(${idx})">✅ اعتمد هذا المقترح</button></div>`;
    });
    html+=`<button class="btn btn-secondary" onclick="closeProposals()">❌ إغلاق</button>`;
    const section=document.getElementById('proposals-section');
    section.innerHTML=html; section.style.display='block';
    section.scrollIntoView({behavior:'smooth'});
}
function applyProposal(idx){
    const prop=window._proposals[idx];
    const m=state.currentMonth;
    if(!state.allocations[m])state.allocations[m]={};
    prop.data.forEach(d=>{
        state.allocations[m][d.pos.id]={};
        getOrderedProjects().forEach((pr,i)=>{state.allocations[m][d.pos.id][pr.id]=d.pcts[i];});
    });
    saveState(); closeProposals(); renderAllocation(); alert('✅ تم اعتماد المقترح');
}
function closeProposals(){
    const s=document.getElementById('proposals-section');
    s.style.display='none'; s.innerHTML='';
}

function renderCosts(){
    const costs=state.otherCosts,projects=getOrderedProjects();
    const rates=getRates(state.currentMonth);
    const othersCount=costs.filter(c=>c.type!=='إيجار').length;
    let rows='';
    costs.forEach(c=>{
        if(!c.distribution)c.distribution={};
        if(!c.distributionActual)c.distributionActual={};
        const rateKey=c.type==='إيجار'?'rent':'other';
        const distTotal=projects.reduce((s,p)=>s+(c.distribution[p.id]||0),0);
        const distActTotal=projects.reduce((s,p)=>s+(c.distributionActual[p.id]||0),0);
        const expDiff=(c.expected||0)-distTotal;
        const actDiff=(c.spent||0)-distActTotal;
        const varDiff=(c.spent||0)-(c.expected||0);
        rows+=`<tr>
        <td style="text-align:right"><strong>${c.name}</strong></td>
        <td>${costTypeLabel(c.type)}</td>
        <td><input type="number" class="amt-input" value="${c.expected||0}" step="0.01" onchange="updateCostField(${c.id},'expected',this.value)"></td>
        <td><input type="number" class="amt-input" value="${c.spent||0}" step="0.01" onchange="updateCostField(${c.id},'spent',this.value)"></td>
        <td style="color:${varDiff>0.01?'#dc3545':(varDiff<-0.01?'#B8860B':'#28a745')}"><strong>${fmt(varDiff)}</strong></td>
        ${projects.map(p=>{
            const amt=c.distribution[p.id]||0;
            const appr=(rates[rateKey]&&rates[rateKey][p.id])||0;
            const actPct=(c.expected||0)?amt/c.expected*100:0;
            const diffCell=Math.abs(actPct-appr)>0.05;
            return `<td><input type="number" class="amt-input" value="${amt}" step="0.01" style="${diffCell?'border-color:#dc3545;background:#fdf2f3':''}" onchange="updateCostDist(${c.id},${p.id},this.value)">
            <div class="cell-hint" style="color:${diffCell?'#dc3545':'#999'}">معتمدة ${fmtPct(appr)} / فعلية ${fmtPct(actPct)}</div></td>`;
        }).join('')}
        <td><strong>${fmt(distTotal)}</strong></td>
        <td style="color:${Math.abs(expDiff)>0.01?'#dc3545':'#28a745'}"><strong>${fmt(expDiff)}</strong></td>
        <td><strong>${fmt(distActTotal)}</strong></td>
        <td style="color:${Math.abs(actDiff)>0.01?'#dc3545':'#28a745'}"><strong>${fmt(actDiff)}</strong></td>
        <td><button class="btn btn-danger btn-sm" onclick="delCost(${c.id})">🗑️</button></td>
        </tr>`;
    });
    let totalRow=`<tr class="total-row"><td colspan="2">📊 الإجمالي</td>
    <td>${fmt(costs.reduce((s,c)=>s+(c.expected||0),0))}</td>
    <td>${fmt(costs.reduce((s,c)=>s+(c.spent||0),0))}</td>
    <td>${fmt(costs.reduce((s,c)=>s+((c.spent||0)-(c.expected||0)),0))}</td>`;
    projects.forEach(p=>{
        const t=costs.reduce((s,c)=>s+((c.distribution&&c.distribution[p.id])||0),0);
        totalRow+=`<td>${fmt(t)}</td>`;
    });
    const tExpDist=costs.reduce((s,c)=>s+projects.reduce((x,p)=>x+((c.distribution&&c.distribution[p.id])||0),0),0);
    const tActDist=costs.reduce((s,c)=>s+projects.reduce((x,p)=>x+((c.distributionActual&&c.distributionActual[p.id])||0),0),0);
    totalRow+=`<td>${fmt(tExpDist)}</td><td></td><td>${fmt(tActDist)}</td><td></td><td></td></tr>`;
    let table=`
    <div class="card" style="overflow-x:auto">
        <div class="card-title">📋 المصروفات وتوزيعها <span style="font-size:11px;color:#888">(نموذج الإضافة أسفل الشاشة)</span></div>
        <div class="info-box" style="font-size:12px">
            💡 <strong>طريقة العمل الشهرية:</strong><br>
            1️⃣ <strong>بداية الشهر:</strong> أدخل "المتوقع" لكل بند (المبلغ المخطط) — ووزّعه على المشاريع حسب النسب المعتمدة (أو يدوياً).<br>
            2️⃣ <strong>نهاية الشهر:</strong> أدخل "الفعلي" من مخرجات النظام المحاسبي ثم اضغط زر <strong>"توزيع الفعلي بنسب المتوقع"</strong> — سيوزع الفعلي على المشاريع بنفس نسب توزيع المتوقع.<br>
            3️⃣ عمود "الفرق" (فعلي − متوقع) يكشف التجاوز فوراً.
        </div>
        <table><thead><tr>
            <th>البند</th><th>النوع</th>
            <th style="background:#dce9f5">المتوقع (بداية الشهر)</th>
            <th style="background:#dce9f5">الفعلي (من المحاسبة)</th>
            <th style="background:#dce9f5">الفرق فعلي−متوقع</th>
            ${projects.map(p=>`<th style="background:#dce9f5" title="${p.nameAr}">${p.code}<br><span style="font-size:9px">توزيع المتوقع</span></th>`).join('')}
            <th>مجموع توزيع المتوقع</th><th>الفرق التوزيع</th>
            <th>توزيع الفعلي</th><th>فرق توزيع الفعلي</th>
            <th></th>
        </tr></thead>
        <tbody>${rows}${totalRow}</tbody></table>
        <p class="legend">🔤 <b>دليل الرموز:</b> ${projects.map(p=>`<b>${p.code}</b> = ${p.nameAr}`).join(' &nbsp;•&nbsp; ')}</p>
    </div>`;
    let form=`
    <div class="card">
        <div class="card-title">⚡ إجراءات سريعة</div>
        <div class="actions-row">
            <button class="btn btn-success" onclick="distributeCostsByRates('إيجار',true)">🏢 وزّع الإيجار المتوقع حسب النسب المعتمدة</button>
            <button class="btn btn-success" onclick="distributeCostsByRates('تشغيلية',true)">💡 وزّع المصاريف المتوقعة حسب النسب المعتمدة</button>
            <button class="btn btn-primary" onclick="distributeActualByExpected()">📥 توزيع الفعلي بنسب المتوقع (لجميع البنود)</button>
            ${othersCount>1?`<button class="btn btn-warning" onclick="mergeOtherCosts()">🧲 دمج بنود المصاريف في بند واحد</button>`:''}
        </div>
    </div>
    <div class="card" id="cost-form-card">
        <div class="card-title">➕ إضافة مصروف جديد</div>
        <div class="form-row">
            <div class="form-group"><label>اسم البند</label><input id="ct-name" placeholder="إيجار المكتب"></div>
            <div class="form-group"><label>النوع</label><select id="ct-type"><option value="إيجار">إيجار</option><option value="تشغيلية">أخرى ومختلفة</option></select></div>
            <div class="form-group"><label>المبلغ المتوقع الشهري</label><input type="number" id="ct-monthly" placeholder="2000" step="0.01"></div>
        </div>
        <button class="btn btn-primary" onclick="addCost()">➕ إضافة</button>
    </div>`;
    document.getElementById('costs').innerHTML=`<h2 class="main-title">🏢 المصروفات الأخرى - ${monthName(state.currentMonth)}</h2>${table}${form}
    <div class="card no-print"><button class="btn btn-success" onclick="saveNow()">💾 حفظ كل المدخلات</button></div>`;
}
function distributeCostsByRates(typeStr,useExpected){
    const rates=getRates(state.currentMonth);
    const key=typeStr==='إيجار'?'rent':'other';
    const r=rates[key]||{};
    const sum=state.projects.reduce((s,p)=>s+(r[p.id]||0),0);
    if(sum<=0){alert('حدد النسب المعتمدة أولاً في تبويب (⚖️ النسب المعتمدة)');return;}
    if(!confirm('سيتم إعادة حساب مبالغ التوزيع المتوقعة لبنود "'+(typeStr==='إيجار'?'الإيجار':'المصاريف الأخرى')+'" حسب النسب المعتمدة. متابعة؟'))return;
    state.otherCosts.forEach(c=>{
        if(c.type!==typeStr)return;
        if(!c.distribution)c.distribution={};
        state.projects.forEach(p=>{
            c.distribution[p.id]=+(((c.expected||0)*(r[p.id]||0))/100).toFixed(2);
        });
    });
    saveState(); renderCosts(); alert('✅ تم التوزيع حسب النسب المعتمدة');
}
// ⭐ توزيع الفعلي بنسب المتوقع
function distributeActualByExpected(){
    if(!confirm('سيتم توزيع المبالغ الفعلية المصروفة على المشاريع بنفس نسب توزيع المبالغ المتوقعة (لجميع البنود). متابعة؟'))return;
    state.otherCosts.forEach(c=>{
        if(!c.distributionActual)c.distributionActual={};
        const base=(c.expected||0);
        if(base<=0){
            // إذا لم يوجد متوقع: وزّع بالتساوي حسب توزيع المتوقع إن وجد وإلا بالتساوي
            const tot=state.projects.reduce((s,p)=>s+(c.distribution[p.id]||0),0);
            if(tot>0){
                state.projects.forEach(p=>{
                    c.distributionActual[p.id]=+(((c.spent||0)*((c.distribution[p.id]||0)/tot)).toFixed(2));
                });
            }
            return;
        }
        state.projects.forEach(p=>{
            const share=((c.distribution[p.id]||0))/base;
            c.distributionActual[p.id]=+(((c.spent||0)*share).toFixed(2));
        });
    });
    saveState(); renderCosts();
    showToast('✅ تم توزيع الفعلي بنسب المتوقع — يمكنك الآن تحديد نسب الشهر القادم');
}
function mergeOtherCosts(){
    const others=state.otherCosts.filter(c=>c.type!=='إيجار');
    if(others.length<=1){alert('لا توجد بنود متعددة للدمج.');return;}
    const names=others.map(c=>c.name).join(' + ');
    if(!confirm(`سيتم دمج ${others.length} بنود:\n${names}\n\nفي بند واحد باسم "المصاريف الأخرى والمختلفة". متابعة؟`))return;
    const sumF=(k)=>others.reduce((s,c)=>s+(parseFloat(c[k])||0),0);
    const dist={};
    state.projects.forEach(p=>{dist[p.id]=+(others.reduce((s,c)=>s+((c.distribution&&c.distribution[p.id])||0),0)).toFixed(2);});
    const distAct={};
    state.projects.forEach(p=>{distAct[p.id]=+(others.reduce((s,c)=>s+((c.distributionActual&&c.distributionActual[p.id])||0),0)).toFixed(2);});
    const rentCosts=state.otherCosts.filter(c=>c.type==='إيجار');
    state.otherCosts=[...rentCosts,{id:state.nextCostId++,name:'المصاريف الأخرى والمختلفة',type:'تشغيلية',
        monthly:+sumF('monthly').toFixed(2),expected:+sumF('expected').toFixed(2),spent:+sumF('spent').toFixed(2),
        distribution:dist,distributionActual:distAct}];
    saveState(); renderCosts(); alert('✅ تم الدمج في بند واحد بنجاح');
}
function updateCostDist(id,projId,val){
    const c=state.otherCosts.find(x=>x.id===id);
    if(c){
        if(!c.distribution)c.distribution={};
        c.distribution[projId]=parseFloat(val)||0;
        saveState(); renderCosts();
    }
}
function updateCostField(id,field,val){
    const c=state.otherCosts.find(x=>x.id===id);
    if(c){c[field]=parseFloat(val)||0;saveState();renderCosts();}
}
function addCost(){
    const name=document.getElementById('ct-name').value.trim();
    const monthly=parseFloat(document.getElementById('ct-monthly').value)||0;
    if(!name||monthly<=0){alert('يرجى إدخال البيانات');return;}
    state.otherCosts.push({id:state.nextCostId++,name,type:document.getElementById('ct-type').value,
        monthly,expected:monthly,spent:0,distribution:{},distributionActual:{}});
    saveState(); renderCosts(); showToast('💾 تم إضافة المصروف');
}
function delCost(id){
    if(confirm('هل أنت متأكد؟')){state.otherCosts=state.otherCosts.filter(c=>c.id!==id);saveState();renderCosts();}
}

const REPORT_RENDER={
exec(){
    const month=reportMonth;
    const projects=getOrderedProjects(),positions=state.positions;
    const totalSal=positions.reduce((s,p)=>s+p.salary,0);
    const dist=getDistribution(month);
    const salL=projects.map((_,i)=>dist.reduce((s,d)=>s+d.projects[i].amount,0));
    const rentL=projects.map(p=>getCostLoadedActual(p.id,'إيجار'));
    const othL=projects.map(p=>getCostLoadedActual(p.id,'تشغيلية'));
    const cumSal=cumulativeSalLoaded();
    const totalLoaded=salL.reduce((s,t)=>s+t,0);
    const gap=totalSal-totalLoaded;
    const oT=getOpeningTotals();
    const expRent=expectedCostTotal('إيجار'),actRent=state.otherCosts.filter(c=>c.type==='إيجار').reduce((s,c)=>s+(c.spent||0),0);
    const expOth=expectedCostTotal('تشغيلية'),actOth=state.otherCosts.filter(c=>c.type!=='إيجار').reduce((s,c)=>s+(c.spent||0),0);
    let rows=projects.map((p,i)=>{
        const remAll=(p.budgetSalaries||0)-getOpeningSal(p.id)-cumSal[p.id]
            +(p.budgetRent||0)-getOpeningRent(p.id)-(rentL[i]||0)
            +(p.budgetOther||0)-getOpeningOther(p.id)-(othL[i]||0);
        const totM=salL[i]+rentL[i]+othL[i];
        return `<tr><td title="${p.nameAr}"><strong>${p.code}</strong></td>
        <td>${fmt(salL[i])}</td><td>${fmt(rentL[i])}</td><td>${fmt(othL[i])}</td>
        <td><strong>${fmt(totM)}</strong></td>
        <td style="color:${remAll<0?'#dc3545':'#28a745'}"><strong>${fmt(remAll)}</strong></td>
        <td>${statusBadge(remAll,(p.budgetSalaries||0)+(p.budgetRent||0)+(p.budgetOther||0))}</td></tr>`;
    }).join('');
    return `
    <div class="report-toolbar"><div class="actions-row">${rpMonth()}</div></div>
    <div class="stats-grid">
        <div class="stat-card yellow"><div class="stat-value">${fmt(totalSal)}</div><div class="stat-label">رواتب الشهر</div></div>
        <div class="stat-card green"><div class="stat-value">${fmt(totalLoaded)}</div><div class="stat-label">المحمّل على المشاريع</div></div>
        <div class="stat-card ${gap>0.01?'red':'green'}"><div class="stat-value">${fmt(gap)}</div><div class="stat-label">الفجوة</div></div>
        <div class="stat-card purple"><div class="stat-value">${fmt(oT.all)}</div><div class="stat-label">الافتتاحي التراكمي</div></div>
    </div>
    <div class="card" style="overflow-x:auto">
        <div class="card-title">المتوقع والفعلي للمصاريف — ${monthName(month)}</div>
        <table><thead><tr><th>النوع</th><th>المتوقع</th><th>الفعلي</th><th>الفرق</th></tr></thead>
        <tbody>
        <tr><td>🏢 الإيجار</td><td>${fmt(expRent)}</td><td>${fmt(actRent)}</td><td style="color:${actRent-expRent>0.01?'#dc3545':'#28a745'}"><strong>${fmt(actRent-expRent)}</strong></td></tr>
        <tr><td>💡 المصاريف الأخرى</td><td>${fmt(expOth)}</td><td>${fmt(actOth)}</td><td style="color:${actOth-expOth>0.01?'#dc3545':'#28a745'}"><strong>${fmt(actOth-expOth)}</strong></td></tr>
        <tr class="total-row"><td>الإجمالي</td><td>${fmt(expRent+expOth)}</td><td>${fmt(actRent+actOth)}</td><td>${fmt(actRent+actOth-expRent-expOth)}</td></tr>
        </tbody></table>
    </div>
    <div class="card" style="overflow-x:auto">
        <div class="card-title">ملخص الشهر (${monthName(month)}) والمتبقي التراكمي</div>
        <table><thead><tr><th>المشروع</th><th>محمّل مرتبات</th><th>محمّل إيجار (فعلي)</th><th>محمّل مصاريف (فعلي)</th><th>إجمالي الشهر</th><th>المتبقي التراكمي</th><th>الحالة</th></tr></thead>
        <tbody>${rows}</tbody></table>
        <p class="legend">💡 المتبقي التراكمي = الميزانيات − الافتتاحي − كل ما حُمّل فعلياً عبر الشهور.</p>
    </div>`;
},
alloc(){
    const month=reportMonth;
    const projects=getOrderedProjects(),positions=state.positions;
    if(!projects.length||!positions.length)return '<div class="card">أضف البيانات أولاً.</div>';
    const dist=getDistribution(month);
    const totalSal=positions.reduce((s,p)=>s+p.salary,0);
    const totalLoaded=dist.reduce((s,d)=>s+d.totalLoaded,0);
    const gap=totalSal-totalLoaded;
    let h1='<th rowspan="2">الوظيفة</th><th rowspan="2">الدرجة</th><th rowspan="2">الراتب</th>';
    let h2='';
    projects.forEach(p=>{
        h1+=`<th colspan="4" class="sub-header" title="${p.nameAr}">${p.code}</th>`;
        h2+='<th class="sub-header">قبل</th><th class="sub-header">%</th><th class="sub-header">المبلغ</th><th class="sub-header">بعد</th>';
    });
    h1+='<th rowspan="2">المحمّل</th><th rowspan="2">المتبقي</th>';
    let rows=dist.map(d=>{
        let r=`<tr><td style="text-align:right"><strong>${d.position.name}</strong></td><td>${d.position.grade}</td><td><strong>${fmt(d.position.salary)}</strong></td>`;
        d.projects.forEach(pd=>{
            r+=`<td class="remaining">${fmt(pd.before)}</td><td>${fmtPct(pd.percentage)}</td><td class="amount">${fmt(pd.amount)}</td><td class="remaining">${fmt(pd.after)}</td>`;
        });
        r+=`<td><strong>${fmt(d.totalLoaded)}</strong></td><td style="color:${Math.abs(d.remaining)>0.01?'#dc3545':'#28a745'}"><strong>${fmt(d.remaining)}</strong></td></tr>`;
        return r;
    }).join('');
    let totalRow=`<tr class="total-row"><td colspan="3">📊 المجموع</td>`;
    for(let i=0;i<projects.length;i++){
        const amt=dist.reduce((s,d)=>s+d.projects[i].amount,0);
        const pct=dist.reduce((s,d)=>s+d.projects[i].percentage,0);
        totalRow+=`<td></td><td>${fmtPct(pct)}</td><td>${fmt(amt)}</td><td></td>`;
    }
    totalRow+=`<td>${fmt(totalLoaded)}</td><td>${fmt(gap)}</td></tr>`;
    return `
    <div class="report-toolbar"><div class="actions-row">${rpMonth()}
    ${gap>0.01?`<span class="badge badge-red" style="font-size:13px;padding:6px 14px">⚠️ الفجوة: ${fmt(gap)}</span>`:'<span class="badge badge-green" style="font-size:13px;padding:6px 14px">✅ التوزيع مكتمل</span>'}
    </div></div>
    <div class="card" style="overflow-x:auto">
        <table class="alloc-table"><thead><tr>${h1}</tr><tr>${h2}</tr></thead><tbody>${rows}${totalRow}</tbody></table>
        <p class="legend">🔤 <b>دليل الرموز:</b> ${projects.map(p=>`<b>${p.code}</b> = ${p.nameAr}`).join(' &nbsp;•&nbsp; ')}</p>
    </div>`;
},
rates_cmp(){
    const month=reportMonth;
    const projects=getOrderedProjects(),positions=state.positions;
    const rates=getRates(month);
    const dist=getDistribution(month);
    const totalSal=positions.reduce((s,p)=>s+p.salary,0);
    const salL=projects.map((_,i)=>dist.reduce((s,d)=>s+d.projects[i].amount,0));
    const rentL=projects.map(p=>getCostLoadedActual(p.id,'إيجار'));
    const othL=projects.map(p=>getCostLoadedActual(p.id,'تشغيلية'));
    const totalRentM=expectedCostTotal('إيجار');
    const totalOthM=expectedCostTotal('تشغيلية');
    function cmpR(type,p,appr,act,exp,amt){
        const dP=act-appr,d$=amt-exp;
        const badge=Math.abs(d$)<0.01?'<span class="badge badge-green">✅ مطابق</span>':(d$>0?`<span class="badge badge-red">أعلى ${fmtPct(dP)}</span>`:`<span class="badge badge-yellow">أقل ${fmtPct(-dP)}</span>`);
        return `<tr><td>${type}</td><td title="${p.nameAr}"><strong>${p.code}</strong></td>
        <td>${fmtPct(appr)}</td><td>${fmtPct(act)}</td>
        <td style="color:${Math.abs(dP)>0.01?'#dc3545':'#28a745'}">${fmtPct(dP)}</td>
        <td>${fmt(exp)}</td><td>${fmt(amt)}</td>
        <td style="color:${d$>0.01?'#dc3545':(d$<-0.01?'#B8860B':'#28a745')}"><strong>${fmt(d$)}</strong></td>
        <td>${badge}</td></tr>`;
    }
    let body='';
    projects.forEach((p,i)=>{
        const salAppr=positions.reduce((s,pos)=>s+((rates.salaries[pos.id]&&rates.salaries[pos.id][p.id])||0),0);
        const salExp=positions.reduce((s,pos)=>{const a=(rates.salaries[pos.id]&&rates.salaries[pos.id][p.id])||0;return s+pos.salary*a/100;},0);
        body+=cmpR('💰 المرتبات',p,salAppr,totalSal?salL[i]/totalSal*100:0,salExp,salL[i]);
        const rA=rates.rent[p.id]||0;
        body+=cmpR('🏢 الإيجار',p,rA,totalRentM?rentL[i]/totalRentM*100:0,totalRentM*rA/100,rentL[i]);
        const oA=rates.other[p.id]||0;
        body+=cmpR('💡 المصاريف',p,oA,totalOthM?othL[i]/totalOthM*100:0,totalOthM*oA/100,othL[i]);
    });
    return `
    <div class="report-toolbar"><div class="actions-row">${rpMonth()}</div></div>
    <div class="card" style="overflow-x:auto">
        <table><thead><tr><th>النوع</th><th>المشروع</th><th>النسبة المعتمدة</th><th>النسبة الفعلية</th><th>الفرق %</th><th>المتوقع $</th><th>المحمّل $</th><th>الفرق $</th><th>الحالة</th></tr></thead>
        <tbody>${body}</tbody></table>
    </div>`;
},
coverage(){
    const projects=getOrderedProjects(),positions=state.positions;
    const rates=getRates(state.currentMonth);
    const cumSal=cumulativeSalLoaded();
    let salRows=positions.map(pos=>{
        const cells=projects.map(p=>{
            const v=getCovSal(p.id,pos.id);
            const amt=covSalAmountPos(p.id,pos.id,rates);
            return `<td>${v} شهر${amt>0?`<div class="cell-hint" style="color:#0d6efd">≈ ${fmt(amt)}</div>`:''}</td>`;
        }).join('');
        const tot=projects.reduce((s,p)=>s+covSalAmountPos(p.id,pos.id,rates),0);
        return `<tr><td style="text-align:right"><strong>${pos.name}</strong> (${pos.grade})</td>${cells}<td><strong>${fmt(tot)}</strong></td></tr>`;
    }).join('');
    let sumRows=projects.map(p=>{
        const expS=covSalAmountProj(p.id,rates),expR=covRentAmount(p.id,rates),expO=covOtherAmount(p.id,rates);
        const actS=cumSal[p.id]||0,actR=getCostLoadedActual(p.id,'إيجار'),actO=getCostLoadedActual(p.id,'تشغيلية');
        return `<tr><td style="text-align:right"><strong>${p.code}</strong> - ${p.nameAr}</td>
        <td>${fmt(expS)}</td><td>${fmt(actS)}</td><td>${covBadge(expS,actS)}</td>
        <td>${getCovRent(p.id)} شهر</td>
        <td>${fmt(expR)}</td><td>${fmt(actR)}</td><td>${covBadge(expR,actR)}</td>
        <td>${getCovOther(p.id)} شهر</td>
        <td>${fmt(expO)}</td><td>${fmt(actO)}</td><td>${covBadge(expO,actO)}</td></tr>`;
    }).join('');
    return `
    <div class="info-box">💡 المبلغ المغطى المتوقع = النسبة المعتمدة × المبلغ المتوقع الشهري × عدد أشهر التغطية. المحمّل الفعلي للمرتبات تراكمي دقيق، وللإيجار والمصاريف يعكس آخر توزيع فعلي محفوظ.</div>
    <div class="card" style="overflow-x:auto">
        <div class="card-title">📅 أشهر تغطية المرتبات لكل وظيفة × مشروع (مع المبلغ المغطى)</div>
        <table class="alloc-table"><thead><tr><th>الوظيفة</th>${projects.map(p=>`<th title="${p.nameAr}">${p.code}</th>`).join('')}<th>إجمالي المغطى</th></tr></thead>
        <tbody>${salRows}</tbody></table>
        <p class="legend">🔤 <b>دليل الرموز:</b> ${projects.map(p=>`<b>${p.code}</b> = ${p.nameAr}`).join(' &nbsp;•&nbsp; ')}</p>
    </div>
    <div class="card" style="overflow-x:auto">
        <div class="card-title">💵 ملخص المبالغ المغطاة المتوقعة مقابل المحمّل الفعلي</div>
        <table><thead><tr>
            <th rowspan="2">المشروع</th>
            <th colspan="3" class="sub-header">💰 المرتبات</th>
            <th colspan="4" class="sub-header">🏢 الإيجار</th>
            <th colspan="4" class="sub-header">💡 المصاريف</th>
        </tr><tr>
            <th class="sub-header">متوقع</th><th class="sub-header">فعلي</th><th class="sub-header">الحالة</th>
            <th class="sub-header">أشهر</th><th class="sub-header">متوقع</th><th class="sub-header">فعلي</th><th class="sub-header">الحالة</th>
            <th class="sub-header">أشهر</th><th class="sub-header">متوقع</th><th class="sub-header">فعلي</th><th class="sub-header">الحالة</th>
        </tr></thead>
        <tbody>${sumRows}</tbody></table>
    </div>`;
},
budget(){
    const projects=getOrderedProjects();
    const cumSal=cumulativeSalLoaded();
    const rentL=projects.map(p=>getCostLoadedActual(p.id,'إيجار'));
    const othL=projects.map(p=>getCostLoadedActual(p.id,'تشغيلية'));
    function row(label,budgets,loaded,openings){
        let r=`<tr><td style="text-align:right"><strong>${label}</strong></td>`;
        budgets.forEach((b,i)=>{
            const rem=(b||0)-(openings[i]||0)-loaded[i];
            r+=`<td>${fmt(b||0)}</td><td>${fmt(openings[i]||0)}</td><td>${fmt(loaded[i])}</td><td style="color:${rem<0?'#dc3545':'#28a745'}"><strong>${fmt(rem)}</strong></td><td>${statusBadge(rem,b)}</td>`;
        });
        r+=`<td>${fmt(budgets.reduce((s,b)=>s+(b||0),0))}</td><td>${fmt(openings.reduce((s,o)=>s+(o||0),0))}</td><td>${fmt(loaded.reduce((s,l)=>s+l,0))}</td><td></td><td></td></tr>`;
        return r;
    }
    return `
    <div class="info-box">💡 هذا التقرير <strong>تراكمي كلي</strong> على المبالغ الفعلية. المتبقي = الميزانية − الافتتاحي − المحمّل الفعلي.</div>
    <div class="card" style="overflow-x:auto">
        <table><thead><tr>
            <th rowspan="2">البند</th>
            ${projects.map(p=>`<th colspan="5" class="sub-header" title="${p.nameAr}">${p.code}${p.pinnedEnd?'📌':''}</th>`).join('')}
            <th colspan="5" class="sub-header">الإجمالي</th>
        </tr><tr>
            ${projects.map(()=>'<th class="sub-header">الميزانية</th><th class="sub-header">الافتتاحي</th><th class="sub-header">المحمّل فعلياً</th><th class="sub-header">المتبقي</th><th class="sub-header">الحالة</th>').join('')}
            <th class="sub-header">الميزانية</th><th class="sub-header">الافتتاحي</th><th class="sub-header">المحمّل فعلياً</th><th class="sub-header">المتبقي</th><th></th>
        </tr></thead>
        <tbody>
        ${row('💰 المرتبات',projects.map(p=>p.budgetSalaries),projects.map(p=>cumSal[p.id]),projects.map(p=>getOpeningSal(p.id)))}
        ${row('🏢 الإيجار',projects.map(p=>p.budgetRent),rentL,projects.map(p=>getOpeningRent(p.id)))}
        ${row('💡 المصاريف الأخرى والمختلفة',projects.map(p=>p.budgetOther),othL,projects.map(p=>getOpeningOther(p.id)))}
        </tbody></table>
        <p class="legend">🔤 <b>دليل الرموز:</b> ${projects.map(p=>`<b>${p.code}</b> = ${p.nameAr}`).join(' &nbsp;•&nbsp; ')}</p>
    </div>`;
},
trend(){
    const projects=getOrderedProjects(),positions=state.positions;
    const totalSal=positions.reduce((s,p)=>s+p.salary,0);
    const allMonths=Object.keys(state.allocations).sort();
    if(!allMonths.length)return '<div class="card">لا توجد أشهر مسجلة بعد.</div>';
    let rows='',cum=projects.map(()=>0),cumTot=0,cumGap=0;
    allMonths.forEach(m=>{
        const d0=getDistribution(m);
        const cells=projects.map((_,i)=>{
            const t=d0.reduce((s,d)=>s+d.projects[i].amount,0);
            cum[i]+=t;
            return `<td>${fmt(t)}</td><td style="color:#6b7280">${fmt(cum[i])}</td>`;
        }).join('');
        const tM=d0.reduce((s,d)=>s+d.totalLoaded,0);
        const gM=totalSal-tM;
        cumTot+=tM;cumGap+=gM;
        rows+=`<tr><td><strong>${monthName(m)}</strong></td>${cells}
        <td><strong>${fmt(tM)}</strong></td><td>${fmt(cumTot)}</td>
        <td style="color:${Math.abs(gM)>0.01?'#dc3545':'#28a745'}">${fmt(gM)}</td>
        <td style="color:${Math.abs(cumGap)>0.01?'#B8860B':'#28a745'}"><strong>${fmt(cumGap)}</strong></td></tr>`;
    });
    return `
    <div class="info-box">💡 لكل شهر: المحمّل الشهري <strong>والتراكمي حتى تاريخه</strong> + الفجوة الشهرية والتراكمية. المرتبات فقط — تاريخية دقيقة.</div>
    <div class="card" style="overflow-x:auto">
        <table><thead><tr><th rowspan="2">الشهر</th>${projects.map(p=>`<th colspan="2" class="sub-header" title="${p.nameAr}">${p.code}</th>`).join('')}<th colspan="2" class="sub-header">الإجمالي</th><th rowspan="2">فجوة الشهر</th><th rowspan="2">الفجوة التراكمية</th></tr>
        <tr>${projects.map(()=>'<th class="sub-header">شهري</th><th class="sub-header">تراكمي</th>').join('')}<th class="sub-header">شهري</th><th class="sub-header">تراكمي</th></tr></thead>
        <tbody>${rows}</tbody></table>
        <p class="legend">🔤 <b>دليل الرموز:</b> ${projects.map(p=>`<b>${p.code}</b> = ${p.nameAr}`).join(' &nbsp;•&nbsp; ')}</p>
    </div>`;
},
project(){
    const projects=getOrderedProjects(),positions=state.positions;
    const p=projects.find(x=>x.id==reportProject);
    if(!p)return '<div class="card">لا يوجد مشروع.</div>';
    const months=Object.keys(state.allocations).sort();
    const rates=getRates(state.currentMonth);
    const obSal=positions.map(pos=>getOpeningPosProject(pos.id,p.id));
    const obSalTot=obSal.reduce((s,v)=>s+v,0);
    const obRent=getOpeningRent(p.id),obOth=getOpeningOther(p.id);
    let mRows=positions.map(pos=>{
        const cov=getCovSal(p.id,pos.id);
        const cells=months.map(m=>{
            const a=(state.allocations[m][pos.id]&&state.allocations[m][pos.id][p.id])||0;
            return `<td>${fmt(pos.salary*a/100)}</td>`;
        }).join('');
        const tot=months.reduce((s,m)=>{const a=(state.allocations[m][pos.id]&&state.allocations[m][pos.id][p.id])||0;return s+pos.salary*a/100;},0);
        return `<tr><td style="text-align:right"><strong>${pos.name}</strong></td>
        <td>${cov} شهر</td>${cells}<td><strong>${fmt(tot)}</strong></td></tr>`;
    }).join('');
    let mTot=`<tr class="total-row"><td>📊 إجمالي الشهر</td><td></td>`;
    const monthTotals=months.map(m=>positions.reduce((s,pos)=>{const a=(state.allocations[m][pos.id]&&state.allocations[m][pos.id][p.id])||0;return s+pos.salary*a/100;},0));
    monthTotals.forEach(t=>{mTot+=`<td>${fmt(t)}</td>`;});
    mTot+=`<td>${fmt(monthTotals.reduce((s,t)=>s+t,0))}</td></tr>`;
    const cumSal=cumulativeSalLoaded()[p.id]||0;
    const cumRent=getCostLoadedActual(p.id,'إيجار'),cumOth=getCostLoadedActual(p.id,'تشغيلية');
    const expS=covSalAmountProj(p.id,rates),expR=covRentAmount(p.id,rates),expO=covOtherAmount(p.id,rates);
    function bRow(label,b,o,l,exp){
        const rem=(b||0)-(o||0)-l;
        const covB=exp!==undefined?covBadge(exp,l):'';
        return `<tr><td style="text-align:right"><strong>${label}</strong></td><td>${fmt(b||0)}</td><td>${fmt(o||0)}</td><td>${fmt(l)}</td><td style="color:${rem<0?'#dc3545':'#28a745'}"><strong>${fmt(rem)}</strong></td><td>${covB}</td></tr>`;
    }
    return `
    <div class="report-toolbar"><div class="actions-row">${rpProject()}</div></div>
    <div class="card">
        <div class="card-title">📇 معلومات المشروع والتغطية</div>
        <table><tbody>

// ================================================================
function cleanCloneForExport(srcEl) {
    const clone = srcEl.cloneNode(true);
    // تحويل inputs إلى نص
    clone.querySelectorAll('input').forEach(inp => {
        const span = document.createElement('span');
        let v = inp.value || '';
        if (inp.type === 'checkbox') v = inp.checked ? '✓' : '✗';
        span.textContent = v;
        span.style.fontWeight = '600';
        if (inp.parentNode) inp.parentNode.replaceChild(span, inp);
    });
    clone.querySelectorAll('select').forEach(sel => {
        const span = document.createElement('span');
        span.textContent = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
        if (sel.parentNode) sel.parentNode.replaceChild(span, sel);
    });
    // إزالة عناصر لا تصلح للتصدير
    clone.querySelectorAll('.no-print,.btn,button').forEach(e => e.remove());
    clone.querySelectorAll('.cell-hint').forEach(e => e.remove());
    clone.querySelectorAll('.badge').forEach(b => {
        b.outerHTML = b.textContent.replace(/[🔴🟡🟢✅⚠️📌]/g,'').trim();
    });
    return clone;
}
function buildExportHTML(sourceSelector, title) {
    const src = document.querySelector(sourceSelector);
    if (!src || !src.innerHTML.trim()) return null;
    let html = '<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8">';
    html += '<title>' + title + '</title><style>';
    html += 'body{font-family:Arial,Tahoma;padding:20px;direction:rtl}';
    html += 'h1{color:#017E84;font-size:18px;border-bottom:3px solid #017E84;padding-bottom:8px}';
    html += 'h2{color:#3d434d;font-size:14px;margin:18px 0 6px}';
    html += '.exp-meta{color:#666;font-size:12px;margin-bottom:14px}';
    html += 'table{border-collapse:collapse;width:100%;font-family:Arial;font-size:11px;margin-bottom:18px}';
    html += 'th{background:#017E84;color:#fff;border:1px solid #7a9ca0;padding:6px 5px;font-weight:bold;text-align:center}';
    html += 'td{border:1px solid #b9c8ca;padding:5px;text-align:center;font-size:11px}';
    html += 'tr:nth-child(even) td{background:#f6f9f9}';
    html += '.total-row td{background:#e0ecee!important;font-weight:bold}';
    html += '.sub-header{background:#dce9f5!important;color:#1e3a5f;font-weight:bold}';
    html += '.amount{background:#d1e7dd;font-weight:bold}';
    html += '.remaining{background:#f4f6f8}';
    html += '.pos-name{max-width:120px}';
    html += '@media print{body{padding:5px}h1{font-size:16px}}';
    html += '</style></head><body>';
    html += '<h1>' + title + '</h1>';
    html += '<div class="exp-meta">نظام إدارة التكاليف المشتركة — الشهر: ' + monthName(state.currentMonth) + ' — تاريخ التصدير: ' + new Date().toLocaleDateString('ar') + '</div>';
    const clone = cleanCloneForExport(src);
    html += clone.innerHTML;
    html += '</body></html>';
    return html;
}
// ⭐ تصدير Excel منسق (ملف .xls يفتح Excel بجداول منسقة حقيقية)
function exportExcelFrom(sourceSelector, title, filename) {
    const html = buildExportHTML(sourceSelector, title);
    if (!html) { alert('لا يوجد محتوى للتصدير.'); return; }
    const blob = new Blob(['\uFEFF' + html], {type:'application/vnd.ms-excel;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename + '.xls';
    a.click();
    showToast('📊 تم تصدير Excel منسق — افتحه في Excel مباشرة');
}
// ⭐ تصدير PDF عبر نافذة طباعة منسقة
function exportPDFFrom(sourceSelector, title, filename) {
    const html = buildExportHTML(sourceSelector, title);
    if (!html) { alert('لا يوجد محتوى للتصدير.'); return; }
    const w = window.open('', '_blank');
    if (!w) { alert('يرجى السماح بالنوافذ المنبثقة لتصدير PDF.'); return; }
    w.document.write(html);
    w.document.close();
    setTimeout(() => {
        w.focus();
        w.print();
        showToast('📄 في نافذة الطباعة اختر "حفظ كـ PDF"');
    }, 500);
}
